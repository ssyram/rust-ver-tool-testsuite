[package]
name = "runner"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Feature-coverage screening runner for Rust verification tools"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tera = "1"
walkdir = "2"
anyhow = "1"
rayon = "1"
wait-timeout = "0.2"
libc = "0.2"
glob = "0.3"

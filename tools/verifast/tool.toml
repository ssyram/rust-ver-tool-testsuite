# VeriFast 26.01 — standalone Rust verifier (separation logic)
#
# Invocation strategy:
#   - We invoke verifast through tools/verifast/verifast-strict-wrapper.sh
#     (NOT directly), which runs verifast with the same flags below and then
#     post-checks the vacuous-pass signature. The current oracle anchors on
#     "src/lib.rs(" appearing in the symex statement list (proves user code
#     was symbolically executed, not just prelude). See the wrapper header
#     for the precise grep; this comment is just the design intent — do not
#     rely on the exact text here, it is descriptive only.
#     Background: docs/fixes/oracle-leak-audit-2026-05-08.md §3.1 +
#     docs/fixes/oracle-leak-rules-implementation-2026-05-08.md §2.1.
#   - The runner strips all TS_* envvars before spawning children
#     (runner/src/exec.rs:165), so we re-export TS_VERIFAST_BIN as the
#     non-prefixed VERIFAST_BIN that the wrapper consumes (same convention
#     as tools/aeneas-coq/tool.toml).
#   - The flags below are documented again here for reference; the wrapper
#     invokes verifast with exactly this argv:
#       -target macOS  : 64-bit LP64 target (arm64-apple-macosx)
#       -shared        : skip the "main function required" check (lib crate)
#       -skip_specless_fns : skip functions without //@ req / //@ ens
#                       annotations. Without this flag, verifast fails on
#                       plain-Rust code that has no specs (overflow checks
#                       fire, etc.). With it, plain-Rust samples exit 0
#                       (tool saw no specs → nothing to disprove); annotated
#                       samples exercise the prover.
#                       This is the flag whose silent-skip behaviour the
#                       wrapper is closing — see the wrapper header.
#       -ignore_unwind_paths : ignore panic/unwind paths; sound only when
#                       the example is compiled with -C panic=abort, but
#                       acceptable for a feature-coverage screening run.
#       -disable_overflow_check : suppress arithmetic overflow errors on
#                       unannotated code that has no range preconditions.
#       -read_options_from_source_file : honour per-file
#                       //verifast_options{...} directives; lets annotated
#                       examples override the defaults.
#
# exit 0 (passed wrapper)  → verification succeeded + wrapper post-check
#                            confirms user code was symex'd → SUCCESS
# exit 2 (rewritten by wrapper) → vacuous pass detected (prelude-only
#                                  symex, user code absent) → FAILED
# exit 1 (verifast direct)  → verification error               → FAILED
#
# Limitation: only src/lib.rs is fed to verifast; the src/bin/__ts_harness.rs
# harness is written by the runner (framework contract) but is intentionally
# ignored — verifast does not use cargo and cannot resolve cross-crate calls.
# The harness template is a minimal placeholder required by the framework.

command = [
  "env",
  "VERIFAST_BIN=${TS_VERIFAST_BIN}",
  "${TS_PROJECT_ROOT}/tools/verifast/verifast-strict-wrapper.sh"
]

timeout_secs = 120

version_command = [
  "${TS_VERIFAST_BIN}",
  "-help"
]

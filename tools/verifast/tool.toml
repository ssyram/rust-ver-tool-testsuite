# VeriFast 26.01 — standalone Rust verifier (separation logic)
#
# Invocation strategy:
#   - verifast is called directly on src/lib.rs (NOT via cargo verifast, which
#     fails when the crate has both lib and bin targets)
#   - cwd = example crate root (set by runner)
#   - -shared        : skip the "main function required" check (lib crate)
#   - -target macOS  : 64-bit LP64 target (arm64-apple-macosx)
#   - -skip_specless_fns : skip functions without //@ req / //@ ens annotations.
#                     Without this flag, verifast fails on plain-Rust code that
#                     has no specs (overflow checks fire, etc.).
#                     With it, plain-Rust samples exit 0 (tool saw no specs →
#                     nothing to disprove); annotated samples exercise the prover.
#   - -ignore_unwind_paths : ignore panic/unwind paths; sound only when the
#                     example is compiled with -C panic=abort, but acceptable
#                     for a feature-coverage screening run.
#   - -disable_overflow_check : suppress arithmetic overflow errors on unannotated
#                     code that has no range preconditions.
#   - -read_options_from_source_file : honour per-file //verifast_options{...}
#                     directives; lets annotated examples override the defaults.
#
# exit 0  → verification succeeded (or no specs to check)  → SUCCESS
# exit 1  → verification error                              → FAILED
#
# Limitation: only src/lib.rs is fed to verifast; the src/bin/__ts_harness.rs
# harness is written by the runner (framework contract) but is intentionally
# ignored — verifast does not use cargo and cannot resolve cross-crate calls.
# The harness template is a minimal placeholder required by the framework.

command = [
  "${TS_VERIFAST_BIN}",
  "-target", "macOS",
  "-shared",
  "-skip_specless_fns",
  "-ignore_unwind_paths",
  "-disable_overflow_check",
  "-read_options_from_source_file",
  "src/lib.rs"
]

timeout_secs = 120

version_command = [
  "${TS_VERIFAST_BIN}",
  "-help"
]

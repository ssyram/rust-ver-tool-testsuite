# 按"不允许 partial"精神：cargo hax exit 0 必要；额外 grep 产物 silent marker 抓
# cargo hax exit 0 但产物含 failure / "TODO: please implement" 的 silent partial 路径
# （后者来自 engine/backends/coq/coq/coq_backend.ml:137 的 default_string_for，
# 是纯文本输出**不发 Diagnostic**——cargo hax 会 exit 0，必须 grep 抓住）。
# 注：`(* NotImplementedYet *)` 是每个 .v 文件的 boilerplate header，**不**算失败信号。
command = [
  "sh", "-c",
  "env HAX_ENGINE_BINARY=${TS_HAX_ENGINE_BIN} cargo +nightly-2025-11-08 hax -C --lib ';' into coq; rc=$?; if [ $rc -eq 0 ]; then if grep -rqE 'failure \\(\\(|please implement the method' proofs/coq/extraction/ 2>/dev/null; then echo '[hax-coq-oracle] FAIL: cargo hax exit 0 but product contains failure / TODO marker (silent partial translation)' >&2; rc=1; fi; fi; exit $rc"
]
timeout_secs    = 600
version_command = [
  "env",
  "HAX_ENGINE_BINARY=${TS_HAX_ENGINE_BIN}",
  "cargo", "+nightly-2025-11-08",
  "hax", "--version"
]
